name: iOS

# Prueba durable de compilación de iOS. Fija la versión de Xcode y FALLA EN VOZ ALTA si no está:
# un job verde tiene que significar que iOS compiló, nunca que el paso se saltó.
# Ningún paso usa continue-on-error, a propósito.
#
# La prueba de instalar y lanzar vive aquí y no en local porque el simulador de un Mac Intel es x86_64
# y los módulos KMP solo declaran iosArm64 + iosSimulatorArm64 (Compose Multiplatform 1.12.2 ya no
# publica artefactos x86_64). Los runners macos-15 son arm64, que es donde esto puede ejecutarse.
on:
  push:
    branches: [main]
    paths: &rutas
      - "iosApp/**"
      - "shared-ui/**"
      - "protocol/**"
      - "relay-client/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *rutas
  workflow_dispatch:

env:
  XCODE_VERSION: "26.5"
  XCODE_BUILD: "17F42"
  XCODE_APP: /Applications/Xcode_26.5.app
  IOS_BUNDLE_ID: dev.j3pf.rp.iosApp

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (compila, instala y lanza)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Exigir la versión de Xcode fijada
        run: |
          set -uo pipefail
          SELECCIONADA=""
          for app in $(ls -d /Applications/Xcode_"$XCODE_VERSION"*.app /Applications/Xcode.app 2>/dev/null || true); do
            echo "--- candidato: $app"
            ls -ld "$app" || true
            readlink "$app" || true
            if [ -d "$app" ] && "$app/Contents/Developer/usr/bin/xcodebuild" -version >/dev/null 2>&1; then
              SELECCIONADA="$app"
              break
            fi
          done
          if [ -z "$SELECCIONADA" ]; then
            echo "::error::No hay ningún Xcode $XCODE_VERSION utilizable en esta imagen. Este job no se salta: ajusta XCODE_VERSION o la imagen del runner."
            ls -1 /Applications | grep -i '^Xcode' || echo "no hay ningún Xcode instalado"
            exit 1
          fi
          echo "seleccionado: $SELECCIONADA"
          sudo xcode-select -s "$SELECCIONADA"
          INSTALADO=$(xcodebuild -version | tr '\n' ' ')
          echo "Xcode instalado: $INSTALADO"
          if ! xcodebuild -version | head -1 | grep -q "Xcode $XCODE_VERSION"; then
            echo "::error::Se esperaba Xcode $XCODE_VERSION (build $XCODE_BUILD) y hay: $INSTALADO"
            exit 1
          fi

      - name: Exigir el SDK de simulador de iOS
        run: |
          xcodebuild -showsdks
          if ! xcodebuild -showsdks | grep -q "iphonesimulator"; then
            echo "::error::No hay SDK de simulador de iOS en esta imagen. No se compila a ciegas."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Framework KMP del simulador
        run: ./gradlew :shared-ui:linkDebugFrameworkIosSimulatorArm64 --console=plain

      - name: Compilar la app para el simulador
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Instalar y lanzar en el simulador
        run: |
          set -euo pipefail
          DISPOSITIVO=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          datos = json.load(sys.stdin)["devices"]
          for runtime, dispositivos in datos.items():
              if "iOS" not in runtime:
                  continue
              for d in dispositivos:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit(0)
          raise SystemExit("no hay ningún simulador de iPhone disponible")
          ')
          echo "dispositivo: $DISPOSITIVO"
          xcrun simctl boot "$DISPOSITIVO" 2>/dev/null || true
          xcrun simctl bootstatus "$DISPOSITIVO" -b
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No se produjo ningún .app en DerivedData; el build no sirvió de nada."
            exit 1
          fi
          echo "app: $APP"
          xcrun simctl install "$DISPOSITIVO" "$APP"
          SALIDA=$(xcrun simctl launch "$DISPOSITIVO" "$IOS_BUNDLE_ID")
          echo "$SALIDA"
          if ! echo "$SALIDA" | grep -qE "^$IOS_BUNDLE_ID: [0-9]+$"; then
            echo "::error::El lanzamiento no devolvió un pid para $IOS_BUNDLE_ID: $SALIDA"
            exit 1
          fi
