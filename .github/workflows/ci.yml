name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocolo y reductor (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fixtures del relay (contrato)
        # La copia versionada se compara contra rp-relay main: si el relay publica un tipo nuevo y nadie
        # sincroniza, este paso falla en vez de dejar el contrato podrido en silencio.
        run: |
          if git clone --depth 1 https://github.com/j3pf/rp-relay ../rp-relay \
             && [ -d ../rp-relay/packages/protocol/fixtures ]; then
            ./scripts/sync-fixtures.sh ../rp-relay
            if ! git diff --exit-code -- protocol/src/test/resources/fixtures/relay; then
              echo "::error::Fixtures desactualizados respecto a rp-relay main: corre scripts/sync-fixtures.sh ../rp-relay y commitea el resultado."
              exit 1
            fi
          else
            echo "::warning::Sin acceso a rp-relay: se usan los fixtures versionados sin comprobar drift."
          fi
      - run: ./gradlew :protocol:test

  app:
    name: App Android (lint, tests, APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = nº de commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitarios y de Robolectric
        run: ./gradlew :app:testDirectDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDirectDebug
      - name: APK de depuración
        run: ./gradlew :app:assembleDirectDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            protocol/build/reports/tests
          retention-days: 1
