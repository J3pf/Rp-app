---
name: Release

# Al etiquetar vX.Y.Z se construye el APK firmado (sabor direct)
# y se publica en GitHub Releases (sideload).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Secretos de firma
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          fi
      - name: Tests
        run: ./gradlew :protocol:test :app:testDirectDebugUnitTest
      - name: APK firmado (sabor direct)
        run: ./gradlew :app:assembleDirectRelease
      - name: Renombrar
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/*.apk \
            "dist/rp-${GITHUB_REF_NAME}-direct.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          # Las notas viven en el repo porque llevan los mínimos y el aviso de que
          # los paquetes no existen en npm; autogenerarlas las perdería.
          body_path: docs/RELEASE_NOTES_v0.6.1.md
